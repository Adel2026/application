name: teacher_center

description: تطبيق عربي لإدارة سنتر تعليمي ودروس خصوصية.
publish_to: "none"
version: 1.1.16+5007

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Core dependencies
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  intl: ^0.20.3
  file_picker: ^13.3.1
  excel: ^4.0.6
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  local_auth: ^2.3.0
  google_sign_in: 6.2.1
  googleapis: ^17.0.0
  http: ^1.6.0
  share_plus: ^13.3.1
  permission_handler: 11.3.1
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  home_widget: ^0.10.0
  google_fonts: ^9.0.0
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  package_info_plus: ^10.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  android_file_picker: 2.1.0
  google_sign_in_ios: 5.7.7
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/audio/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
